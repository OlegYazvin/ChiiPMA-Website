name: Refresh ChiPMA blog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chipma-blog-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Generate article pages
        run: python3 scripts/update_blog.py
      - name: Validate generated pages
        run: |
          python3 -m unittest discover -s tests
          git diff --check
      - name: Save last successful feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Medium blog articles"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
